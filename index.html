<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RunClub — Agenda & Sorties Running</title>
 <script src="https://unpkg.com/@supabase/supabase-js@2.49.4/dist/umd/supabase.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f8fafc; }
    .chat-scroll::-webkit-scrollbar { width: 6px; }
    .chat-scroll::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
  </style>
</head>
<body class="text-slate-800 min-h-screen flex flex-col">

  <!-- NAVBAR -->
  <header class="bg-white border-b border-slate-200 sticky top-0 z-30">
    <div class="max-w-6xl mx-auto px-4 h-16 flex items-center justify-between">
      <div class="flex items-center gap-2">
        <span class="text-2xl">🏃‍♂️</span>
        <span class="font-extrabold text-xl tracking-tight text-slate-900">Run<span class="text-orange-600">Club</span></span>
      </div>

      <div id="auth-section" class="flex items-center gap-3">
        <!-- Injecté dynamiquement -->
      </div>
    </div>
  </header>

  <!-- CONTENU PRINCIPAL -->
  <main class="max-w-6xl mx-auto px-4 py-8 flex-1 w-full grid grid-cols-1 lg:grid-cols-3 gap-8">
    
    <!-- COLONNE GAUCHE (2/3) : AGENDA & SORTIES -->
    <div class="lg:col-span-2 space-y-6">
      <div class="flex flex-wrap items-center justify-between gap-4">
        <div>
          <h1 class="text-2xl font-extrabold text-slate-900">Prochaines sorties</h1>
          <p class="text-sm text-slate-500">Inscris-toi en un clic ou propose un parcours au groupe.</p>
        </div>
        <button id="btn-open-modal" onclick="toggleModal(true)" class="hidden bg-orange-600 hover:bg-orange-700 text-white font-semibold px-4 py-2.5 rounded-xl shadow-sm transition flex items-center gap-2 cursor-pointer">
          <span>+</span> Proposer une sortie
        </button>
      </div>

      <!-- Liste des courses -->
      <div id="runs-list" class="space-y-4">
        <div class="text-center py-12 text-slate-400">Chargement de l'agenda...</div>
      </div>
    </div>

    <!-- COLONNE DROITE (1/3) : CHAT DU GROUPE & MEMBRES -->
    <div class="space-y-6">
      <!-- Chat en direct -->
      <div class="bg-white rounded-2xl border border-slate-200 shadow-sm flex flex-col h-[500px]">
        <div class="p-4 border-b border-slate-100 flex items-center justify-between">
          <div class="flex items-center gap-2">
            <span class="w-2.5 h-2.5 rounded-full bg-emerald-500 animate-pulse"></span>
            <h2 class="font-bold text-slate-900">Le Vestiaire (Chat)</h2>
          </div>
          <span class="text-xs text-slate-400">En direct</span>
        </div>

        <div id="chat-messages" class="flex-1 p-4 overflow-y-auto space-y-3 chat-scroll bg-slate-50/50">
          <!-- Messages injectés ici -->
        </div>

        <form id="chat-form" class="p-3 border-t border-slate-100 flex gap-2">
          <input type="text" id="chat-input" placeholder="Connecte-toi pour discuter..." disabled
            class="flex-1 text-sm bg-slate-100 rounded-xl px-3.5 py-2.5 focus:outline-none focus:ring-2 focus:ring-orange-500 disabled:opacity-60" />
          <button type="submit" id="chat-submit" disabled
            class="bg-slate-900 hover:bg-slate-800 text-white text-sm font-semibold px-4 py-2.5 rounded-xl transition disabled:opacity-40 cursor-pointer">
            Envoyer
          </button>
        </form>
      </div>

      <!-- Liste des coureurs inscrits sur le site -->
      <div class="bg-white rounded-2xl border border-slate-200 shadow-sm p-4">
        <h3 class="font-bold text-slate-900 text-sm mb-3">Membres du club (<span id="members-count">0</span>)</h3>
        <div id="members-list" class="flex flex-wrap gap-2">
          <!-- Avatars des membres -->
        </div>
      </div>
    </div>

  </main>

  <!-- MODALE : PROPOSER UNE COURSE -->
  <div id="run-modal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-xs hidden items-center justify-center p-4 z-50">
    <div class="bg-white rounded-2xl max-w-md w-full p-6 shadow-xl space-y-4">
      <div class="flex items-center justify-between">
        <h2 class="text-lg font-extrabold text-slate-900">Nouvelle sortie running</h2>
        <button onclick="toggleModal(false)" class="text-slate-400 hover:text-slate-600 text-xl font-bold cursor-pointer">&times;</button>
      </div>
      <form id="new-run-form" class="space-y-3">
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">Titre de la sortie *</label>
          <input type="text" id="run-title" required placeholder="Ex: Sortie longue Canal du Midi"
            class="w-full border border-slate-200 rounded-xl px-3 py-2 text-sm focus:outline-none focus:border-orange-500" />
        </div>
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">Date et heure *</label>
            <input type="datetime-local" id="run-date" required
              class="w-full border border-slate-200 rounded-xl px-3 py-2 text-sm focus:outline-none focus:border-orange-500" />
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">Distance</label>
            <input type="text" id="run-distance" placeholder="Ex: 10 km"
              class="w-full border border-slate-200 rounded-xl px-3 py-2 text-sm focus:outline-none focus:border-orange-500" />
          </div>
        </div>
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">Lieu de RDV *</label>
            <input type="text" id="run-location" required placeholder="Ex: Parking du Parc"
              class="w-full border border-slate-200 rounded-xl px-3 py-2 text-sm focus:outline-none focus:border-orange-500" />
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">Allure prévue</label>
            <input type="text" id="run-pace" placeholder="Ex: 5:30/km"
              class="w-full border border-slate-200 rounded-xl px-3 py-2 text-sm focus:outline-none focus:border-orange-500" />
          </div>
        </div>
        <div class="pt-2 flex justify-end gap-2">
          <button type="button" onclick="toggleModal(false)" class="px-4 py-2 text-sm font-semibold text-slate-600 hover:bg-slate-100 rounded-xl cursor-pointer">Annuler</button>
          <button type="submit" class="px-4 py-2 text-sm font-semibold bg-orange-600 hover:bg-orange-700 text-white rounded-xl cursor-pointer">Publier la sortie</button>
        </div>
      </form>
    </div>
  </div>

  <!-- LOGIQUE SUPABASE -->
  <script>
    // =========================================================================
    // CONFIGURATION : REMPLACEZ CES DEUX VALEURS PAR CELLES DE VOTRE SUPABASE
    // =========================================================================
    const SUPABASE_URL = 'https://nzoysgkqelpayfxwbmbd.supabase.co/rest/v1/';
    const SUPABASE_ANON_KEY = 'sb_publishable_cS53pYq9msZ6FxVcUIuGdA_B5AEud7n';
    // =========================================================================

    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
  db: { schema: 'running' }
});

    let currentUser = null;
    let currentProfile = null;
    let allProfiles = {};

    // 1. GESTION DE L'AUTHENTIFICATION GOOGLE
    async function signInWithGoogle() {
      await supabaseClient.auth.signInWithOAuth({
        provider: 'google',
        options: { redirectTo: window.location.origin }
      });
    }

    async function signOut() {
      await supabaseClient.auth.signOut();
      window.location.reload();
    }

    async function initAuth() {
      const { data: { session } } = await supabaseClient.auth.getSession();
      currentUser = session?.user || null;

      if (currentUser) {
        // S'assurer que le profil existe dans running.profiles (utile si l'utilisateur existait déjà sur l'autre projet)
        const { data: existingProfile } = await supabaseClient
          .from('profiles')
          .select('*')
          .eq('id', currentUser.id)
          .single();

        if (!existingProfile) {
          const { data: newProf } = await supabaseClient.from('profiles').insert({
            id: currentUser.id,
            full_name: currentUser.user_metadata?.full_name || currentUser.email.split('@')[0],
            avatar_url: currentUser.user_metadata?.avatar_url || ''
          }).select().single();
          currentProfile = newProf;
        } else {
          currentProfile = existingProfile;
        }
      }

      renderAuthUI();
      await loadProfiles();
      await loadRuns();
      await loadMessages();
      setupRealtime();
    }

    function renderAuthUI() {
      const authDiv = document.getElementById('auth-section');
      const btnModal = document.getElementById('btn-open-modal');
      const chatInput = document.getElementById('chat-input');
      const chatSubmit = document.getElementById('chat-submit');

      if (currentUser && currentProfile) {
        btnModal.classList.remove('hidden');
        chatInput.disabled = false;
        chatInput.placeholder = "Écrire un message au groupe...";
        chatSubmit.disabled = false;

        const adminBadge = currentProfile.role === 'admin' 
          ? `<span class="bg-amber-100 text-amber-800 text-[10px] font-bold px-2 py-0.5 rounded-full uppercase">Admin</span>` 
          : '';

        authDiv.innerHTML = `
          <div class="flex items-center gap-2.5">
            ${adminBadge}
            <img src="${currentProfile.avatar_url || 'https://ui-avatars.com/api/?name=' + encodeURIComponent(currentProfile.full_name)}" class="w-8 h-8 rounded-full border border-slate-200 object-cover" />
            <span class="text-sm font-semibold hidden sm:inline">${escapeHtml(currentProfile.full_name)}</span>
            <button onclick="signOut()" class="text-xs text-slate-500 hover:text-red-600 font-semibold ml-2 cursor-pointer">Déconnexion</button>
          </div>
        `;
      } else {
        authDiv.innerHTML = `
          <button onclick="signInWithGoogle()" class="bg-slate-900 hover:bg-slate-800 text-white text-sm font-semibold px-4 py-2 rounded-xl flex items-center gap-2 shadow-sm transition cursor-pointer">
            <svg class="w-4 h-4" viewBox="0 0 24 24"><path fill="currentColor" d="M21.35 11.1h-9.17v2.73h6.51c-.33 3.81-3.5 5.44-6.5 5.44C8.36 19.27 5 16.25 5 12c0-4.1 3.2-7.27 7.2-7.27c3.09 0 4.9 1.97 4.9 1.97L19 4.72S16.56 2 12.1 2C6.42 2 2.03 6.8 2.03 12c0 5.05 4.13 10 10.22 10c5.35 0 9.25-3.67 9.25-9.09c0-1.15-.15-1.81-.15-1.81Z"/></svg>
            Connexion Google
          </button>
        `;
      }
    }

    // 2. CHARGEMENT DES MEMBRES
    async function loadProfiles() {
      const { data } = await supabaseClient.from('profiles').select('*');
      allProfiles = {};
      const membersList = document.getElementById('members-list');
      membersList.innerHTML = '';

      (data || []).forEach(p => {
        allProfiles[p.id] = p;
        const avatar = p.avatar_url || `https://ui-avatars.com/api/?name=${encodeURIComponent(p.full_name || 'R')}`;
        membersList.innerHTML += `
          <div class="flex items-center gap-1.5 bg-slate-100 rounded-full pr-2.5 pl-1 py-1" title="${escapeHtml(p.full_name)}">
            <img src="${avatar}" class="w-5 h-5 rounded-full object-cover" />
            <span class="text-xs font-medium text-slate-700">${escapeHtml((p.full_name || 'Coureur').split(' ')[0])}</span>
          </div>
        `;
      });
      document.getElementById('members-count').textContent = (data || []).length;
    }

    // 3. AGENDA DES SORTIES & INSCRIPTIONS
    async function loadRuns() {
      const { data: runs } = await supabaseClient
        .from('runs')
        .select('*, run_participants(user_id)')
        .order('run_date', { ascending: true });

      const container = document.getElementById('runs-list');
      if (!runs || runs.length === 0) {
        container.innerHTML = `<div class="bg-white rounded-2xl border border-slate-200 p-8 text-center text-slate-500">Aucune sortie prévue pour le moment. Soyez le premier à en proposer une !</div>`;
        return;
      }

      container.innerHTML = runs.map(run => {
        const dateObj = new Date(run.run_date);
        const dateStr = dateObj.toLocaleDateString('fr-FR', { weekday: 'long', day: 'numeric', month: 'long' });
        const timeStr = dateObj.toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' });
        
        const participants = run.run_participants || [];
        const isParticipating = currentUser && participants.some(p => p.user_id === currentUser.id);
        const canDelete = currentProfile && (currentProfile.role === 'admin' || run.created_by === currentUser?.id);

        const avatarsHtml = participants.map(p => {
          const prof = allProfiles[p.user_id] || { full_name: 'Coureur' };
          const img = prof.avatar_url || `https://ui-avatars.com/api/?name=${encodeURIComponent(prof.full_name)}`;
          return `<img src="${img}" title="${escapeHtml(prof.full_name)}" class="w-7 h-7 rounded-full border-2 border-white -ml-2 first:ml-0 object-cover" />`;
        }).join('');

        return `
          <div class="bg-white rounded-2xl border border-slate-200 p-5 shadow-xs hover:border-orange-200 transition space-y-4">
            <div class="flex items-start justify-between gap-4">
              <div>
                <div class="text-xs font-bold uppercase tracking-wider text-orange-600 mb-1">${dateStr} à ${timeStr}</div>
                <h3 class="text-lg font-extrabold text-slate-900">${escapeHtml(run.title)}</h3>
                <div class="flex flex-wrap gap-3 mt-2 text-xs text-slate-600 font-medium">
                  <span class="bg-slate-100 px-2.5 py-1 rounded-lg">📍 ${escapeHtml(run.location)}</span>
                  ${run.distance ? `<span class="bg-slate-100 px-2.5 py-1 rounded-lg">📏 ${escapeHtml(run.distance)}</span>` : ''}
                  ${run.pace ? `<span class="bg-slate-100 px-2.5 py-1 rounded-lg">⚡ ${escapeHtml(run.pace)}</span>` : ''}
                </div>
              </div>
              ${canDelete ? `<button onclick="deleteRun('${run.id}')" class="text-xs text-slate-400 hover:text-red-600 font-semibold cursor-pointer" title="Supprimer la sortie">Supprimer</button>` : ''}
            </div>

            <div class="pt-3 border-t border-slate-100 flex items-center justify-between gap-4">
              <div class="flex items-center gap-3">
                <div class="flex items-center pl-2">${avatarsHtml}</div>
                <span class="text-xs font-semibold text-slate-500">${participants.length} inscrit${participants.length > 1 ? 's' : ''}</span>
              </div>

              ${currentUser ? `
                <button onclick="toggleParticipation('${run.id}', ${isParticipating})"
                  class="px-4 py-2 rounded-xl text-xs font-bold transition cursor-pointer ${
                    isParticipating 
                      ? 'bg-emerald-50 text-emerald-700 border border-emerald-200 hover:bg-red-50 hover:text-red-600 hover:border-red-200' 
                      : 'bg-orange-600 text-white hover:bg-orange-700 shadow-xs'
                  }">
                  ${isParticipating ? '✓ Inscrit (Se désinscrire)' : 'Je participe !'}
                </button>
              ` : `<span class="text-xs text-slate-400 italic">Connecte-toi pour t'inscrire</span>`}
            </div>
          </div>
        `;
      }).join('');
    }

    async function toggleParticipation(runId, isParticipating) {
      if (!currentUser) return;
      if (isParticipating) {
        await supabaseClient.from('run_participants').delete().match({ run_id: runId, user_id: currentUser.id });
      } else {
        await supabaseClient.from('run_participants').insert({ run_id: runId, user_id: currentUser.id });
      }
      await loadRuns();
    }

    async function deleteRun(runId) {
      if (!confirm('Supprimer cette sortie ?')) return;
      await supabaseClient.from('runs').delete().eq('id', runId);
      await loadRuns();
    }

    document.getElementById('new-run-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      if (!currentUser) return;
      await supabaseClient.from('runs').insert({
        title: document.getElementById('run-title').value,
        run_date: new Date(document.getElementById('run-date').value).toISOString(),
        location: document.getElementById('run-location').value,
        distance: document.getElementById('run-distance').value,
        pace: document.getElementById('run-pace').value,
        created_by: currentUser.id
      });
      e.target.reset();
      toggleModal(false);
      await loadRuns();
    });

    // 4. CHAT EN DIRECT
    async function loadMessages() {
      const { data: messages } = await supabaseClient
        .from('messages')
        .select('*')
        .order('created_at', { ascending: true })
        .limit(50);

      const chatBox = document.getElementById('chat-messages');
      chatBox.innerHTML = (messages || []).map(msg => {
        const author = allProfiles[msg.user_id] || { full_name: 'Coureur' };
        const isMe = currentUser && msg.user_id === currentUser.id;
        const canDelete = currentProfile && (currentProfile.role === 'admin' || isMe);

        return `
          <div class="flex flex-col ${isMe ? 'items-end' : 'items-start'}">
            <div class="flex items-center gap-1.5 mb-0.5">
              <span class="text-[11px] font-semibold text-slate-500">${escapeHtml(author.full_name)}</span>
              ${canDelete ? `<button onclick="deleteMessage('${msg.id}')" class="text-[10px] text-slate-300 hover:text-red-500 cursor-pointer">&times;</button>` : ''}
            </div>
            <div class="px-3.5 py-2 rounded-2xl text-sm max-w-[85%] ${
              isMe ? 'bg-orange-600 text-white rounded-br-xs' : 'bg-white border border-slate-200 text-slate-800 rounded-bl-xs'
            }">
              ${escapeHtml(msg.content)}
            </div>
          </div>
        `;
      }).join('');
      chatBox.scrollTop = chatBox.scrollHeight;
    }

    document.getElementById('chat-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const input = document.getElementById('chat-input');
      const content = input.value.trim();
      if (!content || !currentUser) return;
      input.value = '';
      await supabaseClient.from('messages').insert({ user_id: currentUser.id, content });
    });

    async function deleteMessage(msgId) {
      await supabaseClient.from('messages').delete().eq('id', msgId);
    }

    // 5. TEMPS RÉEL (SUPABASE REALTIME)
    function setupRealtime() {
      supabaseClient.channel('running-room')
        .on('postgres_changes', { event: '*', schema: 'running', table: 'messages' }, () => loadMessages())
        .on('postgres_changes', { event: '*', schema: 'running', table: 'runs' }, () => loadRuns())
        .on('postgres_changes', { event: '*', schema: 'running', table: 'run_participants' }, () => loadRuns())
        .on('postgres_changes', { event: '*', schema: 'running', table: 'profiles' }, () => loadProfiles())
        .subscribe();
    }

    // UTILITAIRES
    function toggleModal(show) {
      const modal = document.getElementById('run-modal');
      modal.classList.toggle('hidden', !show);
      modal.classList.toggle('flex', show);
    }

    function escapeHtml(str) {
      if (!str) return '';
      return str.replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m]));
    }

    // Lancement
    initAuth();
  </script>
</body>
</html>
